<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OUPS! Editor</title>
  <link rel="icon" type="image/png" href="/gold_LOGO.png">
  <link rel="stylesheet" href="editor.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>

<div id="passwordScreen" style="display:none;">
  <div class="passwordBox">
    <h2>OUPS! EDITOR</h2>
    <p>Enter password to continue</p>

    <form id="passwordForm">
      <input type="password" id="editorPassword"
             placeholder="Password" required>
      <button type="submit">ENTER EDITOR</button>
    </form>

    <div id="passwordError"></div>
  </div>
</div>
  

<header>
  <a href="/" class="logo">OUPS!</a>



  
<nav id="toolbar">

    <!-- SELECT -->
    <button data-tool="select" title="Select">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 11-7 1-3 6z"/></svg>
        <small>S</small>
    </button>
    <!-- IMAGE -->
    <button id="image" title="Add image">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <small>I</small>
    </button>
    <!-- DRAW -->
    <button data-tool="draw" title="Draw">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L8 18l-4 1 1-4Z"/></svg>
        <small>D</small>
    </button>
    <!-- TEXT -->
    <button data-tool="text" title="Add text">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16m-4 0h8"/></svg>
        <small>T</small>
    </button>
    <!-- BOLD -->
    <button id="bold" title="Bold">
        <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 010 8H6zm0 8h9a4 4 0 010 8H6z"/></svg>
        <small>B</small>
    </button>
    <!-- ITALIC -->
    <button id="italic" title="Italic">
        <svg viewBox="0 0 24 24"><path d="M19 4h-9M14 20H5m10-16L9 20"/></svg>
        <small>I</small>
    </button>
    <!-- UNDERLINE -->
    <button id="underline" title="Underline">
        <svg viewBox="0 0 24 24"><path d="M6 4v7a6 6 0 0012 0V4M4 21h16"/></svg>
        <small>U</small>
    </button>
    <!-- FONT SIZE -->
    <input type="number" id="fontSize" value="32" min="6" max="200" title="Font size">
    <!-- COLOUR -->
    <input type="color" id="colour" value="#111111" title="Text colour">
    <!-- UNDO -->
    <button id="undo" title="Undo">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6M3 13a9 9 0 0115-6l2 2"/></svg>
        <small>Z</small>
    </button>
    <!-- REDO -->
    <button id="redo" title="Redo">
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6m6 0A9 9 0 006 7l-2 2"/></svg>
        <small>Y</small>
    </button>
    <!-- DELETE -->
    <button id="delete" title="Delete">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>
        <small>X</small>
    </button>
    
  </nav>
</header>

<main>
  <aside>
    <label>Projects 2027:</label>
    <div id="projects"></div>
  </aside>

  <section class="workspace">
    <div class="page-info">
      <span id="pageName">PAGE 01</span>
      <span id="status">SAVED</span>
    </div>

    <div id="canvasScroll">
      <canvas id="canvas"></canvas>
    </div>
  </section>
</main>

<input type="file" id="upload" accept="image/*" hidden>


<script src="editor.js"></script>

</body>

</html>
