<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OUPS! Editor</title>
  <link rel="icon" type="image/png" href="/gold_LOGO.png">
  <link rel="stylesheet" href="editor.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>

<div id="passwordScreen" style="display:none;">
  <div class="passwordBox">
    <h2>OUPS! EDITOR</h2>
    <p>Enter password to continue</p>

    <form id="passwordForm">
      <input type="password" id="editorPassword"
             placeholder="Password" required>
      <button type="submit">ENTER EDITOR</button>
    </form>

    <div id="passwordError"></div>
  </div>
</div>
  

<header>
  <a href="/" class="logo">OUPS!</a>

<nav id="toolbar">
    <button data-tool="select">SELECT</button>
    <button id="image">IMAGE</button>
    <button data-tool="draw">DRAW</button>

    <span class="separator">•</span>

    <button data-tool="text">TEXT</button>
    <button id="bold">B</button>
    <button id="italic">I</button>
    <button id="underline">U</button>

    <datalist id="fontSizes">
    <option value="8">
    <option value="10">
    <option value="12">
    <option value="14">
    <option value="16">
    <option value="18">
    <option value="20">
    <option value="24">
    <option value="28">
    <option value="32">
    <option value="36">
    <option value="48">
    <option value="60">
    <option value="72">
    <option value="96">
    <option value="120">
    <option value="150">
    <option value="200">
    </datalist>


    <span class="separator">•</span>

    <button id="colourButton" type="button">COLOR</button>
    <input type="color" id="colour" value="#111111" hidden>


    <span class="separator">•</span>

    <button id="undo">UNDO</button>
    <button id="redo">REDO</button>
    <button id="delete">DELETE</button>
</nav>

</header>

<main>
  <aside>
    <label>*</label>
    <div id="projects"></div>
  </aside>

  <section class="workspace">
    <div class="page-info">
      <span id="pageName">PAGE 01</span>
      <span id="status">SAVED</span>
    </div>

    <div id="canvasScroll">
      <canvas id="canvas"></canvas>
    </div>
  </section>
</main>

<input type="file" id="upload" accept="image/*" hidden>


<script src="editor.js"></script>

</body>

</html>
