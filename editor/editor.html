<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OUPS! Editor</title>
  <link rel="icon" type="image/png" href="/gold_LOGO.png">
  <link rel="stylesheet" href="editor.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body>

<div id="passwordScreen" style="display:none;">
  <div class="passwordBox">
    <h2>OUPS! EDITOR</h2>
    <p>Enter password to continue</p>

    <form id="passwordForm">
      <input type="password" id="editorPassword"
             placeholder="Password" required>
      <button type="submit">ENTER EDITOR</button>
    </form>

    <div id="passwordError"></div>
  </div>
</div>
  

<header>
  <a href="/2ndDRAMA/" class="logo">OUPS!</a>



    <nav id="toolbar">
    <button data-tool="select">↖<small>V</small></button>
    <button data-tool="text">T<small>T</small></button>
    <button id="image">▧<small>I</small></button>
    <button data-tool="draw">✎<small>D</small></button>
    <button data-tool="select">↔<small>M</small></button>
    <button data-tool="rect">□<small>S</small></button>
    <button id="bold">B<small>B</small></button>
    <button id="italic">I<small>I</small></button>
    <button id="underline">U<small>U</small></button>
    <button id="delete">×<small>X</small></button>
    <button id="undo">↶<small>Z</small></button>
    <button id="redo">↷<small>Y</small></button>

    <input type="number" id="fontSize" value="32" min="6" max="200" title="Font size">
    <input type="color" id="colour" value="#111111" title="Colour">
    <button id="preview">PREVIEW ↗</button>
  </nav>
</header>

<main>
  <aside>
    <label>OUR DRAMA 2027</label>
    <div id="projects"></div>
  </aside>

  <section class="workspace">
    <div class="page-info">
      <span id="pageName">PAGE 01</span>
      <span id="status">SAVED</span>
    </div>

    <div id="canvasScroll">
      <canvas id="canvas"></canvas>
    </div>
  </section>
</main>

<input type="file" id="upload" accept="image/*" hidden>


<script src="editor.js"></script>

</body>

</html>
